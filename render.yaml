# Free-tier oriented Render blueprint.
# Notes:
# - Free Web Services spin down after idle (~15 min). First request is slow.
# - Free plan has no Redis / no Background Workers → use QUEUE_CONNECTION=sync
#   and ATTENDANCE_ASYNC_FACE=false so jobs run inside the web request.
# - Photos: use Cloudflare R2 free tier (disk on free Render is ephemeral).
# - Neon: free PostgreSQL project.
#
# After first deploy: set RUN_SEEDERS=true once, redeploy, then set back to false.

services:
  - type: web
    name: dtr-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: DTR System
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: APP_KEY
        generateValue: true
      # APP_URL is set at runtime from RENDER_EXTERNAL_URL in docker-entrypoint.sh
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: ATTENDANCE_PHOTO_DISK
        value: database
      - key: ATTENDANCE_ASYNC_FACE
        value: "false"
      - key: TELESCOPE_ENABLED
        value: "false"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: RUN_SEEDERS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FACE_VERIFICATION_PROVIDER
        value: mock

  # Admin SPA — set VITE_API_URL to the API URL, then rebuild.
  # Dashboard settings (repo root, NOT rootDir=web):
  #   Root Directory: (leave empty)
  #   Build Command: cd web && npm ci && npm run build
  #   Publish Directory: web/dist
  - type: web
    name: dtr-admin
    runtime: static
    plan: free
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
