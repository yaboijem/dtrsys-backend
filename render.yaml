# Free-tier oriented Render blueprint.
# Notes:
# - Free Web Services spin down after idle (~15 min). First request is slow.
# - Free plan has no Redis / no Background Workers → use QUEUE_CONNECTION=sync
#   and ATTENDANCE_ASYNC_FACE=false so jobs run inside the web request.
# - Photos: use Cloudflare R2 free tier (disk on free Render is ephemeral).
# - Neon: free PostgreSQL project.
#
# After first deploy: set RUN_SEEDERS=true once, redeploy, then set back to false.

services:
  - type: web
    name: dtr-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: DTR System
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: APP_KEY
        generateValue: true
      # APP_URL is set at runtime from RENDER_EXTERNAL_URL in docker-entrypoint.sh
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: ATTENDANCE_PHOTO_DISK
        value: s3
      - key: ATTENDANCE_ASYNC_FACE
        value: "false"
      - key: TELESCOPE_ENABLED
        value: "false"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: RUN_SEEDERS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: FACE_VERIFICATION_PROVIDER
        value: mock

  # Admin SPA — set VITE_API_URL to the dtr-api URL after first API deploy, then rebuild.
  - type: web
    name: dtr-admin
    runtime: static
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
